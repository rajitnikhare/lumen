[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-local"
version = "0.1.0"
description = "A local-first personal AI assistant with an encrypted, permissioned library"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "python-pptx>=1.0,<2"]

[project.scripts]
lumen = "lumen.__main__:main"

[tool.setuptools.package-data]
lumen = ["static/*"]

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
